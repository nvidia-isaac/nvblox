name: nvblox premerge
on:
  pull_request:
jobs:
  lint_precommit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit clang-format==14.0.6
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
  premerge_x86_cu11_u22:
    name: Build and test x86/CU11/U22
    needs: [lint_precommit]
    runs-on: [self-hosted, gpu] # GPU jobs will run on AWS
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: premerge_x86_cu11_u22 - Unit tests
        uses: ./.github/actions/build-and-test
        with:
          platform: x86_64
          cuda-version: '11'
          ubuntu-version: '22'
          ngc-api-key: ${{ secrets.NGC_API_KEY }}
  premerge_x86_cu12_u22:
    name: Build and test x86/CU12/U22
    needs: [lint_precommit]
    runs-on: [self-hosted, gpu] # GPU jobs will run on AWS
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: premerge_x86_cu12_u22 - Unit tests
        uses: ./.github/actions/build-and-test
        with:
          platform: x86_64
          cuda-version: '12'
          ubuntu-version: '22'
          ngc-api-key: ${{ secrets.NGC_API_KEY }}
  premerge_x86_cu13_u24:
    name: Build and test x86/CU13/U24
    needs: [lint_precommit]
    runs-on: [self-hosted, gpu] # GPU jobs will run on AWS
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: premerge_x86_cu13_u24 - Unit tests
        uses: ./.github/actions/build-and-test
        with:
          platform: x86_64
          cuda-version: '13'
          ubuntu-version: '24'
          ngc-api-key: ${{ secrets.NGC_API_KEY }}
