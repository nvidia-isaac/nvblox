[project]
name = "nvblox_torch"
description = "Pytorch interface for nvblox"

# setup.py reads the Torch version recorded when the native wrapper was linked.
# A global upper bound cannot describe both CUDA12/Torch2.9 and CUDA13.2/Torch2.14 wheels.
dynamic = ["version", "dependencies"]

[build-system]
requires = [
    "setuptools>=61.0"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["nvblox_torch*"]

[tool.pydocstyle]
convention = "google"
add-ignore = ["D100"]
# NOTE(dtingdahl) files to check are specified in .pre-commit-config.yaml
